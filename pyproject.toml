[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-term-deposit-prediction"
version = "0.1.0"
description = "MLOps pipeline for bank term deposit prediction using CatBoost"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apache-airflow==3.0.4",
    "catboost==1.2.8",
    "certifi>=2023.0.0",
    "charset-normalizer>=3.0.0",
    "evidently==0.7.11",
    "fastapi==0.116.1",
    "kaggle==1.7.4.5",
    "matplotlib==3.10.5",
    "mlflow==3.3.1",
    "numpy==2.2.6",
    "pandas==2.3.2",
    "requests>=2.28.0",
    "scikit-learn==1.7.1",
    "seaborn==0.13.2",
    "shap==0.48.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "data*", "models*", "mlruns*", "mlartifacts*", "reports*", "docker*", "docs*"]

[tool.setuptools.package-dir]
"" = "."

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "pytest==8.4.1",
]
