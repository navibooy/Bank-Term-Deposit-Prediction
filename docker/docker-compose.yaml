version: "3.9"

services:
  mlflow:
    build:
      context: ..                       # project root
      dockerfile: docker/mlflow.Dockerfile
    container_name: mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:////mlruns/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns
    volumes:
      - ../mlruns:/mlruns               # maps project-root/mlruns into container
    ports:
      - "5000:5000"
    restart: unless-stopped

  postgres:
    image: postgres:14
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  airflow-webserver:
    build:
      context: ..                       # project root
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow-webserver
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ../dags:/opt/airflow/dags
      - ../data:/opt/airflow/data
      - ../reports:/opt/airflow/reports
      - ../src:/opt/airflow/src
    ports:
      - "8081:8080"
    depends_on:
      - mlflow
      - postgres
    restart: unless-stopped
    command: >
      bash -lc "
      airflow db upgrade || airflow db init;
      airflow users create --username admin --firstname Admin --lastname User
        --role Admin --email admin@example.com --password admin || true;
      exec airflow webserver
      "

  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow-scheduler
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ../dags:/opt/airflow/dags
      - ../data:/opt/airflow/data
      - ../reports:/opt/airflow/reports
      - ../src:/opt/airflow/src
    depends_on:
      - airflow-webserver
      - postgres
    restart: unless-stopped
    command: >
      bash -lc "exec airflow scheduler"

  fastapi:
    build:
      context: ..                       # project root
      dockerfile: docker/fastapi.Dockerfile
    container_name: fastapi
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"                     # FastAPI API
    volumes:
      - ../src:/app/src
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      - mlflow
    restart: unless-stopped

volumes:
  postgres_data: