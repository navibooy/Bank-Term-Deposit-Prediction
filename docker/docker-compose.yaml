services:
  mlflow:
    build:
      context: .                 # relative to docker/
      dockerfile: mlflow.Dockerfile
    container_name: mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:////mlruns/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns
    volumes:
      - ../mlruns:/mlruns        # maps project-root/mlruns into container
    ports:
      - "5000:5000"
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: airflow.Dockerfile
    container_name: airflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8080:8080"              # Airflow UI
    volumes:
      - ../dags:/opt/airflow/dags
      - ../data:/opt/airflow/data
      - ../reports:/opt/airflow/reports
      - ../src:/opt/airflow/src  # allow DAGs to import project code
    depends_on:
      - mlflow
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: fastapi.Dockerfile
    container_name: fastapi
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"              # FastAPI API
    volumes:
      - ../src:/app/src
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      - mlflow
    restart: unless-stopped